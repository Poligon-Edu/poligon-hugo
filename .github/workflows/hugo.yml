name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for features like .Lastmod
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Hugo's dartsass transpiler shells out to a `sass` executable, so the
      # standalone Dart Sass binary must be on PATH (the npm package does not work).
      - name: Install Dart Sass
        run: |
          SASS_VERSION=1.108.1
          curl -sL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o /tmp/dart-sass.tar.gz
          tar -xzf /tmp/dart-sass.tar.gz -C /tmp
          echo "/tmp/dart-sass" >> "$GITHUB_PATH"
          # $GITHUB_PATH applies only to later steps, so call the binary by full path here
          /tmp/dart-sass/sass --version

      - name: Build with Hugo
        run: |
          hugo \
          --gc \
          --minify \
          --baseURL "https://poligon-edu.ro/"

      # 🌟 UPGRADED TO V5: Supports Node 24 natively & resolves upload validation changes
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 🌟 UPGRADED TO V5: Completely eliminates Node 20 deprecation issues
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
